<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MedPrism and Sci-Industrialist essays, research notes, and daily-life writing by Wenhao Liu."
    />
    <link rel="canonical" href="https://wenzel-liu.github.io/blog.html" />
    <title>Blog | Wenhao Liu</title>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico" />
    <link rel="stylesheet" href="/assets/css/fonts.css" />
    <script>
      (function () {
        document.documentElement.classList.add('reveal-ready');
        try {
          var key = 'site-theme';
          var pref = localStorage.getItem(key) || 'system';
          var valid = ['light', 'dark', 'system'];
          if (valid.indexOf(pref) < 0) {
            pref = 'system';
          }
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = pref === 'system' ? (dark ? 'dark' : 'light') : pref;
          document.documentElement.setAttribute('data-theme-preference', pref);
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.classList.toggle('dark', resolved === 'dark');
        } catch {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/entries/blog.tsx"></script>
  </body>
</html>
